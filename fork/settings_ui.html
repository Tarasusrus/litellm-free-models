<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy settings</title>
<style>
  :root { --fg: #1b1b1b; --muted: #6b6b6b; --line: #d9d9d9; --bg: #fafafa; --ok: #1e7f3c; --bad: #b3261e; --warn: #9a6700; --accent: #2456c4; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --muted: #9a9a9a; --line: #3a3a3a; --bg: #161616; --ok: #5fcf7a; --bad: #ff7b72; --warn: #e3b341; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  input[type=password], input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  input.dirty { border-color: var(--accent); }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .status { white-space: nowrap; font-size: 13px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  .name { font-weight: 600; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { display: flex; gap: 12px; align-items: center; margin: 18px 0; flex-wrap: wrap; }
  #log { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 48px; }
  #login { max-width: 420px; }
  #login input { margin: 8px 0; }
  .hidden { display: none; }
  .keyrow { display: flex; gap: 4px; }
  .keyrow button { padding: 2px 8px; }
  a { color: var(--accent); }
  @media (max-width: 640px) { .col-check { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Proxy settings</h1>
  <p class="sub">Provider keys for the <code>standard</code> and <code>tools</code> routes. Apply writes <code>.env</code> and restarts the proxy.</p>

  <section id="login">
    <label for="master">Master key (<code>LITELLM_MASTER_KEY</code> from <code>.env</code>)</label>
    <input id="master" type="password" autocomplete="current-password" placeholder="sk-…">
    <button class="primary" id="loginBtn">Open</button>
    <div id="loginErr" class="bad"></div>
  </section>

  <section id="app" class="hidden">
    <table>
      <thead><tr><th>#</th><th>Provider</th><th>Key</th><th>Status</th><th class="col-check"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="bar">
      <button class="primary" id="applyBtn">Apply</button>
      <button id="checkAllBtn">Check all keys</button>
      <button id="reloadBtn">Reload</button>
      <span id="proxyState" class="muted"></span>
    </div>
    <div id="log" class="muted">Waiting…</div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let master = sessionStorage.getItem("master") || "";
  let providers = [];
  const dirty = {};

  async function api(method, path, body) {
    const res = await fetch(path, {
      method, headers: { "Authorization": "Bearer " + master, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { logout(); throw new Error("master key rejected"); }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  function logout() {
    master = ""; sessionStorage.removeItem("master");
    $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function stateText(p) {
    const s = p.state;
    const base = s === "ok" ? `<span class="ok">key set ${esc(p.masked)}</span>`
      : s === "default" ? `<span class="muted">default tier</span>`
      : s === "placeholder" ? `<span class="warn">example value ${esc(p.masked)} — replace or clear; the proxy tries it as a key</span>`
      : `<span class="muted">empty</span>`;
    const c = p.check;
    if (!c) return base;
    if (c.status === "ok") return base + `<br><span class="ok">✓ ${c.models} models</span>`;
    if (c.status === "fail") return base + `<br><span class="bad">✗ ${esc(c.error)}</span>`;
    if (c.status === "missing") return base + `<br><span class="muted">not checked: no key</span>`;
    return base;
  }

  function render() {
    const tb = $("rows"); tb.innerHTML = "";
    providers.forEach((p, i) => {
      const tr = document.createElement("tr");
      const link = p.console_url ? `<a href="${esc(p.console_url)}" target="_blank" rel="noopener">where to get</a>` : "";
      const hint = p.hint ? `<div class="hint">${esc(p.hint)}</div>` : "";
      let inputs = p.env_var
        ? `<div class="keyrow"><input type="password" data-var="${esc(p.env_var)}" placeholder="${esc(p.masked || "not set")}" autocomplete="off">`
          + (p.state === "empty" ? "" : `<button data-clear="${esc(p.env_var)}" title="clear the stored key">✕</button>`) + `</div>`
        : `<span class="muted">no key</span>`;
      if (p.api_base_env) {
        inputs += `<input type="text" data-var="${esc(p.api_base_env)}" placeholder="${esc(p.api_base_env)}" value="${esc(p.api_base || "")}" autocomplete="off" style="margin-top:4px">`;
      }
      tr.innerHTML = `<td class="muted">${i + 1}</td>
        <td><div class="name">${esc(p.display)}</div><div class="hint">${link}</div>${hint}</td>
        <td>${inputs}</td>
        <td class="status" id="st-${esc(p.name)}">${stateText(p)}</td>
        <td class="col-check">${p.checkable ? `<button data-check="${esc(p.name)}">Check</button>` : ""}</td>`;
      tb.appendChild(tr);
    });
    tb.querySelectorAll("input[data-var]").forEach(inp => {
      inp.addEventListener("input", () => {
        const v = inp.dataset.var;
        const p = providers.find(p => p.env_var === v || p.api_base_env === v);
        const original = p && p.api_base_env === v ? (p.api_base || "") : null;
        const clearing = inp.type === "password" && inp.placeholder === "will be cleared";
        if (clearing || (inp.type === "password" ? inp.value !== "" : inp.value !== original)) { dirty[v] = inp.value; inp.classList.add("dirty"); }
        else { delete dirty[v]; inp.classList.remove("dirty"); }
      });
    });
    tb.querySelectorAll("button[data-check]").forEach(btn => btn.addEventListener("click", () => check(btn.dataset.check, btn)));
    tb.querySelectorAll("button[data-clear]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.clear;
      const inp = tb.querySelector(`input[data-var="${v}"]`);
      inp.value = ""; inp.placeholder = "will be cleared"; inp.classList.add("dirty");
      dirty[v] = "";
    }));
  }

  async function load() {
    const data = await api("GET", "/api/providers");
    providers = data.providers;
    render();
  }

  async function check(name, btn) {
    if (btn) btn.disabled = true;
    const cell = $("st-" + name);
    cell.innerHTML += `<br><span class="muted">checking…</span>`;
    try {
      const p = providers.find(p => p.name === name);
      const body = { provider: name };
      if (p && p.env_var && Object.prototype.hasOwnProperty.call(dirty, p.env_var)) {
        body.value = dirty[p.env_var];
      }
      const res = await api("POST", "/api/check", body);
      if (p) p.check = res;
      cell.innerHTML = stateText(p);
    } catch (e) { cell.innerHTML += `<br><span class="bad">${esc(e.message)}</span>`; }
    if (btn) btn.disabled = false;
  }

  async function checkAll() {
    $("checkAllBtn").disabled = true;
    await Promise.all(providers.filter(p => p.checkable).map(p => check(p.name)));
    $("checkAllBtn").disabled = false;
  }

  function showProxy(px) {
    $("proxyState").innerHTML = px.ready
      ? `<span class="ok">proxy ready</span> · ${px.models.length} model names`
      : `<span class="bad">proxy not ready</span>`;
    const lines = [];
    lines.push(px.ready ? `Proxy ready. /v1/models: ${px.models.length} names.` : "Proxy not ready.");
    const chains = px.chains || (px.chain && px.chain.length ? { standard: px.chain } : {});
    for (const route of ["standard", "tools"]) {
      const chain = chains[route] || [];
      lines.push(`'${route}' chain (${chain.length}):`);
      chain.forEach(c => lines.push(`  ${String(c.order).padStart(2)}. ${c.provider.padEnd(13)} ${c.model}`));
    }
    $("log").textContent = lines.join("\n");
    $("log").classList.remove("muted");
  }

  async function apply() {
    const vars = Object.keys(dirty);
    if (!vars.length) { $("log").textContent = "Nothing changed."; return; }
    $("applyBtn").disabled = true;
    $("log").textContent = `Writing ${vars.join(", ")} to .env and restarting the proxy… (up to 2 min)`;
    try {
      const res = await api("POST", "/api/apply", { values: dirty });
      for (const k of Object.keys(dirty)) delete dirty[k];
      await load();
      showProxy(res.proxy);
      await checkAll();
    } catch (e) { $("log").textContent = "Apply failed: " + e.message; }
    $("applyBtn").disabled = false;
  }

  async function proxy() {
    try { showProxy(await api("GET", "/api/proxy")); } catch (e) { $("log").textContent = e.message; }
  }

  async function open() {
    try {
      await load();
      sessionStorage.setItem("master", master);
      $("login").classList.add("hidden"); $("app").classList.remove("hidden");
      proxy();
    } catch (e) { $("loginErr").textContent = e.message; }
  }

  $("loginBtn").addEventListener("click", () => { master = $("master").value.trim(); open(); });
  $("master").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
  $("applyBtn").addEventListener("click", apply);
  $("checkAllBtn").addEventListener("click", checkAll);
  $("reloadBtn").addEventListener("click", () => { load(); proxy(); });
  if (master) open();
})();
</script>
</body>
</html>
