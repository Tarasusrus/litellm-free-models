# Fork: config.yaml is rendered INSIDE the proxy container on every start
# (fork/docker-entrypoint.sh: template + .env + fork additions), so
# `cp .env.example .env` + `docker compose up -d` is the whole setup.
# Nothing has to be rendered on the host first; `make render-config` is
# still there for K8s and the standalone `make docker-run`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-litellm-postgres}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-litellm}
      # No default on purpose: a silently ignored password is worse than a
      # hard startup error. Set POSTGRES_PASSWORD in .env (see .env.example).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-litellm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - litellm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-litellm-redis}
    # --requirepass erzwingt Passwort-Auth. Kein Default: REDIS_PASSWORD muss
    # in .env gesetzt sein (siehe .env.example), sonst schlaegt der Start
    # laut fehl statt still mit einem bekannten Default-Passwort zu laufen.
    # --save "" = reiner LRU-Cache ohne Persistenz (Cache-Daten sind
    # verzichtbar und waermen sich selbst wieder auf; keine BGSAVE-Forks).
    command:
      - "redis-server"
      - "--port"
      - "${REDIS_PORT:-6379}"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
    healthcheck:
      # -e: Exit-Code != 0 bei Error-Replies (z.B. NOAUTH), sonst ist der
      # Healthcheck auch bei kaputter Auth immer gruen.
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "-e", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - litellm-network
    restart: unless-stopped

  litellm-proxy:
    # Fork: the official image plus the repo mounted read-only; the
    # entrypoint renders the config at start. The custom Dockerfile
    # (config baked into the image) stays available for `make docker-run`.
    image: ghcr.io/berriai/litellm:v1.97.0
    container_name: ${LITELLM_CONTAINER_NAME:-litellm-free-models}
    ports:
      - "${LITELLM_PORT:-4444}:4000"  # LiteLLM proxy port
    environment:
      # Pass all API keys from .env file
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
      - CLOUDFLARE_API_BASE=${CLOUDFLARE_API_BASE}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - POOLSIDE_API_KEY=${POOLSIDE_API_KEY}
      - HETZNER_VLLM_API_KEY=${HETZNER_VLLM_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY}
      - LLM7IO_API_KEY=${LLM7IO_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      # PostgreSQL Database URL for LiteLLM (key management, spend tracking, etc.)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-litellm}
      # Redis (resolved by LiteLLM via os.environ/REDIS_* in config.yaml)
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      # Fork: the whole repo (template, renderer, fork/, .env) read-only;
      # the rendered config never touches the host.
      - ./:/repo:ro
    entrypoint: ["/repo/fork/docker-entrypoint.sh"]
    command: ["--port", "4000"]
    restart: unless-stopped
    healthcheck:
      # The litellm image has neither curl nor wget on PATH; python3 (part
      # of the image) via urllib is the only reliably available HTTP client.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - litellm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fork: settings page (fork/settings_ui.py). Provider keys in the browser:
  # writes .env, restarts the proxy through the Docker socket, shows the
  # `standard` chain. Loopback only; login with LITELLM_MASTER_KEY.
  # The repo is mounted read-write because .env is replaced atomically
  # (temp file + rename in the same directory); nothing else is written.
  settings-ui:
    image: python:3.12-alpine
    container_name: ${SETTINGS_UI_CONTAINER_NAME:-litellm-settings-ui}
    ports:
      - "127.0.0.1:${SETTINGS_UI_PORT:-4445}:4445"
    environment:
      - SETTINGS_ENV_FILE=/repo/.env
      - SETTINGS_BIND_HOST=0.0.0.0
      - SETTINGS_PORT=4445
      - PROXY_URL=http://litellm-proxy:4000
      - PROXY_CONTAINER=${LITELLM_CONTAINER_NAME:-litellm-free-models}
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./:/repo
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["python3", "/repo/fork/settings_ui.py"]
    restart: unless-stopped
    networks:
      - litellm-network

networks:
  litellm-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
